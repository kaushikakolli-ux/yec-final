    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchHandler = typeof originalFetch === 'function' ? originalFetch.bind(window) : originalFetch;
          
          function makeFetchSettable(target) {
            if (!target) return;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return fetchHandler;
                },
                set: function(fn) {
                  fetchHandler = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }

          makeFetchSettable(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            makeFetchSettable(Window.prototype);
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            makeFetchSettable(globalThis);
          }
        } catch (err) {}
      })();
    </script>
