<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <style>
      .trace { fill: none; stroke: #0f172a; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .trace-accent { fill: none; stroke: #ff9900; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .via-ring { fill: #ffffff; stroke: #0f172a; stroke-width: 1.5; }
      .via-center { fill: #0f172a; }
      .via-gold { fill: #ff9900; }
      .via-teal { fill: #39ae8a; }
      .via-red { fill: #e31837; }
      .ic-body { fill: #ffffff; stroke: #0f172a; stroke-width: 2; rx: 3; }
      .ic-notch { fill: none; stroke: #0f172a; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- 1. Horizontal Seamless Traces -->
  <!-- Top seamless trace at y=40 -->
  <path class="trace" d="M 0 40 L 30 40 L 45 55 L 105 55 L 120 40 L 200 40" />

  <!-- Bottom seamless trace at y=160 -->
  <path class="trace" d="M 0 160 L 40 160 L 55 145 L 90 145 L 105 160 L 150 160 L 165 175 L 200 175" />
  <!-- Wrapped counterpart for (200, 175) is (0, 175) -->
  <path class="trace" d="M 0 175 L 15 175 L 30 160" />

  <!-- 2. Vertical Seamless Traces -->
  <!-- Left seamless vertical trace at x=20 -->
  <path class="trace" d="M 20 0 L 20 75 L 35 90 L 35 125 L 20 140 L 20 200" />

  <!-- Right seamless vertical trace at x=175 -->
  <path class="trace" d="M 175 0 L 175 25 L 160 40" />
  <path class="trace" d="M 175 60 L 175 110 L 185 120 L 185 180 L 175 190 L 175 200" />

  <!-- Center-Left vertical seamless at x=75 -->
  <path class="trace" d="M 75 0 L 75 25 L 60 40 L 60 55" />
  <path class="trace" d="M 75 200 L 75 175 L 90 160" />

  <!-- 3. Microchip / IC Unit at (100, 100) -->
  <rect x="85" y="85" width="30" height="30" class="ic-body" />
  <path class="ic-notch" d="M 97 85 C 97 89 103 89 103 85" />

  <!-- IC Pins - Left -->
  <line class="trace" x1="77" y1="92" x2="85" y2="92" />
  <line class="trace" x1="77" y1="100" x2="85" y2="100" />
  <line class="trace" x1="77" y1="108" x2="85" y2="108" />

  <!-- IC Pins - Right -->
  <line class="trace" x1="115" y1="92" x2="123" y2="92" />
  <line class="trace" x1="115" y1="100" x2="123" y2="100" />
  <line class="trace" x1="115" y1="108" x2="123" y2="108" />

  <!-- Traces connecting to IC pins -->
  <path class="trace" d="M 77 92 L 65 92 L 55 102 L 45 102" />
  <path class="trace" d="M 77 108 L 65 108 L 60 113 L 60 125" />
  <path class="trace" d="M 123 92 L 135 92 L 145 82 L 155 82" />
  <path class="trace" d="M 123 108 L 135 108 L 145 118 L 145 140" />

  <!-- Branch from top trace into IC pin middle -->
  <path class="trace" d="M 105 55 L 105 75 L 115 85" />

  <!-- 4. Diagonal Accent Tracks & Branching Interconnects -->
  <!-- Top Right Angle Path -->
  <path class="trace" d="M 130 18 L 145 18 L 160 33 L 160 40" />
  <!-- Trace with 45 degree jog -->
  <path class="trace" d="M 135 145 L 145 145 L 155 135 L 175 135" />
  <path class="trace" d="M 105 160 L 105 145 L 115 135 L 115 125" />

  <!-- SMT Resistor/Capacitor Pad Pairs -->
  <!-- Pad pair 1 -->
  <rect x="135" y="52" width="7" height="4" fill="#0f172a" rx="1" />
  <rect x="146" y="52" width="7" height="4" fill="#0f172a" rx="1" />
  <line class="trace" x1="120" y1="54" x2="135" y2="54" />
  <line class="trace" x1="153" y1="54" x2="165" y2="54" />

  <!-- Pad pair 2 -->
  <rect x="40" y="123" width="4" height="7" fill="#0f172a" rx="1" />
  <rect x="40" y="134" width="4" height="7" fill="#0f172a" rx="1" />

  <!-- 5. Via Nodes (Test Points & Solder Pads) with Engineering YEC accents -->
  <!-- Via at (45, 102) -->
  <circle cx="45" cy="102" r="3.5" class="via-ring" />
  <circle cx="45" cy="102" r="1.5" class="via-teal" />

  <!-- Via at (60, 125) -->
  <circle cx="60" cy="125" r="3.5" class="via-ring" />
  <circle cx="60" cy="125" r="1.5" class="via-gold" />

  <!-- Via at (155, 82) -->
  <circle cx="155" cy="82" r="3.5" class="via-ring" />
  <circle cx="155" cy="82" r="1.5" class="via-gold" />

  <!-- Via at (145, 140) -->
  <circle cx="145" cy="140" r="3.5" class="via-ring" />
  <circle cx="145" cy="140" r="1.5" class="via-red" />

  <!-- Via at (130, 18) -->
  <circle cx="130" cy="18" r="3.5" class="via-ring" />
  <circle cx="130" cy="18" r="1.5" class="via-center" />

  <!-- Via at (165, 54) -->
  <circle cx="165" cy="54" r="3.5" class="via-ring" />
  <circle cx="165" cy="54" r="1.5" class="via-teal" />

  <!-- Via at (90, 145) -->
  <circle cx="90" cy="145" r="3.5" class="via-ring" />
  <circle cx="90" cy="145" r="1.5" class="via-center" />

  <!-- Via at (35, 90) -->
  <circle cx="35" cy="90" r="3.5" class="via-ring" />
  <circle cx="35" cy="90" r="1.5" class="via-center" />

  <!-- Via at (175, 60) -->
  <circle cx="175" cy="60" r="3.5" class="via-ring" />
  <circle cx="175" cy="60" r="1.5" class="via-gold" />

  <!-- Corner test pad -->
  <circle cx="15" cy="15" r="4.5" class="via-ring" />
  <circle cx="15" cy="15" r="2" class="via-teal" />

  <circle cx="185" cy="15" r="4.5" class="via-ring" />
  <circle cx="185" cy="15" r="2" class="via-gold" />

  <circle cx="185" cy="185" r="4.5" class="via-ring" />
  <circle cx="185" cy="185" r="2" class="via-red" />

  <circle cx="15" cy="185" r="4.5" class="via-ring" />
  <circle cx="15" cy="185" r="2" class="via-gold" />
</svg>
