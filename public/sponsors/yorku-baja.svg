<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Teko:wght@700&amp;family=Inter:wght@700;800;900&amp;display=swap');
      .baja-title { font-family: 'Teko', 'Inter', sans-serif; font-size: 46px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .baja-sub { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 900; fill: #e31837; letter-spacing: 4px; }
      .baja-tag { font-family: 'Inter', sans-serif; font-size: 9.5px; font-weight: 800; fill: #555555; letter-spacing: 1.5px; }
    </style>
    <filter id="bajaDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <g transform="translate(15, 10)">
    <!-- Baja SAE Racing Buggy / Tire Emblem -->
    <g transform="translate(15, 16)" filter="url(#bajaDrop)">
      <!-- Hexagonal / Shield Frame -->
      <polygon points="36,4 66,22 66,58 36,76 6,58 6,22" fill="#18181b" stroke="#e31837" stroke-width="2.5" />
      
      <!-- Off-Road Roll Cage & Suspension Geometry -->
      <!-- Wheels / Tires -->
      <circle cx="20" cy="52" r="9" fill="#27272a" stroke="#ffffff" stroke-width="2" />
      <circle cx="20" cy="52" r="4" fill="#e31837" />
      <circle cx="52" cy="52" r="9" fill="#27272a" stroke="#ffffff" stroke-width="2" />
      <circle cx="52" cy="52" r="4" fill="#e31837" />
      
      <!-- Chassis / Rollcage Lines -->
      <path d="M 22 46 L 28 26 L 44 26 L 50 46 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M 28 26 L 36 14 L 44 26" fill="none" stroke="#e31837" stroke-width="2.5" stroke-linejoin="round" />
      <line x1="28" y1="36" x2="44" y2="36" stroke="#ffffff" stroke-width="2" />
      <line x1="36" y1="26" x2="36" y2="46" stroke="#e31837" stroke-width="2" />
      
      <!-- Mud / Dust Track Splashes -->
      <circle cx="10" cy="62" r="1.5" fill="#e31837" />
      <circle cx="62" cy="62" r="1.5" fill="#e31837" />
    </g>

    <!-- Typography Block -->
    <text x="96" y="56" class="baja-title">YORKU BAJA</text>
    <text x="98" y="78" class="baja-sub">BAJA SAE RACING</text>
    <line x1="98" y1="90" x2="320" y2="90" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
    <text x="98" y="110" class="baja-tag">ALL-TERRAIN VEHICLE DESIGN • EST. 2026</text>
  </g>
</svg>
