<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;family=Inter:wght@700;800;900&amp;display=swap');
      .cel-acronym { font-family: 'Montserrat', sans-serif; font-size: 46px; font-weight: 900; fill: #0f172a; letter-spacing: 2px; }
      .cel-title { font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 900; fill: #e31837; letter-spacing: 0.5px; }
      .cel-school { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; fill: #475569; letter-spacing: 1px; }
      .cel-est { font-family: 'Inter', sans-serif; font-size: 9.5px; font-weight: 800; fill: #0f172a; letter-spacing: 2px; }
    </style>
    <filter id="celDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.14" />
    </filter>
  </defs>

  <g transform="translate(15, 10)">
    <!-- Civil Engineering Structural Truss / Bridge Emblem -->
    <g transform="translate(14, 18)" filter="url(#celDrop)">
      <!-- Structural Hexagonal Frame in Lassonde Crimson -->
      <polygon points="36,4 66,22 66,58 36,76 6,58 6,22" fill="#e31837" stroke="#0f172a" stroke-width="2" />
      
      <!-- Golden / White Structural Truss & Suspension Bridge Cables -->
      <!-- Bridge Roadbed -->
      <line x1="12" y1="50" x2="60" y2="50" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <!-- Towers -->
      <line x1="24" y1="18" x2="24" y2="58" stroke="#ffffff" stroke-width="2.5" />
      <line x1="48" y1="18" x2="48" y2="58" stroke="#ffffff" stroke-width="2.5" />
      <!-- Suspension Cables -->
      <path d="M 12 36 Q 24 48 36 36 Q 48 48 60 36" fill="none" stroke="#fbbf24" stroke-width="2" />
      <!-- Truss Triangulation -->
      <line x1="24" y1="28" x2="48" y2="50" stroke="#ffffff" stroke-width="1.8" />
      <line x1="48" y1="28" x2="24" y2="50" stroke="#ffffff" stroke-width="1.8" />
      <!-- Crown apex -->
      <polygon points="36,10 40,16 32,16" fill="#fbbf24" />
    </g>

    <!-- Typography Block -->
    <text x="102" y="58" class="cel-acronym">CEL</text>
    <text x="104" y="80" class="cel-title">CIVIL ENGINEERS OF LASSONDE</text>
    <line x1="104" y1="92" x2="330" y2="92" stroke="#e31837" stroke-width="2.5" stroke-linecap="round" />
    <text x="104" y="110" class="cel-school">YORK UNIVERSITY • LASSONDE</text>
    <text x="104" y="125" class="cel-est">REPRESENTATIVE SOCIETY • EST. 2015</text>
  </g>
</svg>
