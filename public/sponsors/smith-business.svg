<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;family=Montserrat:wght@600;800&amp;display=swap');
      .smith-title { font-family: 'Cinzel', Georgia, serif; font-size: 42px; font-weight: 900; fill: #002452; letter-spacing: 1px; }
      .smith-sub { font-family: 'Montserrat', Arial, sans-serif; font-size: 11.5px; font-weight: 800; fill: #b90e30; letter-spacing: 3.5px; }
      .smith-queens { font-family: 'Montserrat', Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #002452; letter-spacing: 1.5px; }
    </style>
    <filter id="smith-drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#002452" flood-opacity="0.15" />
    </filter>
  </defs>

  <g transform="translate(15, 10)">
    <!-- Queen's University Official Tricolour Shield Crest -->
    <g transform="translate(15, 20)" filter="url(#smith-drop)">
      <!-- Shield Base -->
      <path d="M 0 0 L 52 0 C 52 40 48 65 26 80 C 4 65 0 40 0 0 Z" fill="#002452" stroke="#002452" stroke-width="2" />
      
      <!-- Gold St. Andrew Cross / Charge -->
      <path d="M 0 8 L 8 0 L 26 22 L 44 0 L 52 8 L 34 28 L 52 50 C 46 62 38 71 26 77 C 14 71 6 62 0 50 L 18 28 Z" fill="#eeb310" />
      
      <!-- Open Book (Wisdom) in Center of Shield -->
      <g transform="translate(17, 24)">
        <path d="M -9 4 Q 0 0 9 4 L 9 16 Q 0 12 -9 16 Z" fill="#ffffff" stroke="#002452" stroke-width="1.2" />
        <line x1="0" y1="2" x2="0" y2="14" stroke="#002452" stroke-width="1.2" />
        <!-- Red Bookmark / Ribbon -->
        <path d="M -1 13 L 0 17 L 1 13 Z" fill="#b90e30" />
      </g>

      <!-- Royal Crown Motif on Top -->
      <g transform="translate(13, -12)">
        <path d="M 0 10 L 5 4 L 13 8 L 21 4 L 26 10 Z" fill="#eeb310" stroke="#002452" stroke-width="1.5" stroke-linejoin="round" />
        <circle cx="5" cy="3" r="1.8" fill="#b90e30" />
        <circle cx="13" cy="7" r="1.8" fill="#002452" />
        <circle cx="21" cy="3" r="1.8" fill="#b90e30" />
      </g>
    </g>

    <!-- Typography Wordmark -->
    <!-- Brand Title: SMITH -->
    <text x="88" y="58" class="smith-title">Smith</text>

    <!-- Red Subtitle: SCHOOL OF BUSINESS -->
    <text x="90" y="80" class="smith-sub">SCHOOL OF BUSINESS</text>

    <!-- Thin elegant gold accent divider -->
    <line x1="90" y1="92" x2="310" y2="92" stroke="#eeb310" stroke-width="2.5" stroke-linecap="round" />

    <!-- Queen's University Affiliation -->
    <text x="90" y="112" class="smith-queens">Queen’s University</text>
  </g>
</svg>
