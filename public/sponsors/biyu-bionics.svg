<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;family=Inter:wght@600;700;800;900&amp;display=swap');
      .biyu-title { font-family: 'Cinzel', 'Inter', Georgia, serif; font-size: 34px; font-weight: 900; fill: #0f3822; letter-spacing: 1px; }
      .biyu-sub { font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 800; fill: #10b981; letter-spacing: 2px; }
      .biyu-dept { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 700; fill: #374151; letter-spacing: 0.5px; }
      .biyu-tag { font-family: 'Inter', sans-serif; font-size: 9.5px; font-weight: 800; fill: #0f3822; letter-spacing: 1.5px; }
    </style>
    <linearGradient id="bioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#081c15" />
    </linearGradient>
    <filter id="bioDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#081c15" flood-opacity="0.2" />
    </filter>
  </defs>

  <g transform="translate(15, 10)">
    <!-- Bionic & Biomedical Engineering Crest -->
    <g transform="translate(14, 18)" filter="url(#bioDrop)">
      <!-- Deep Forest Green Hexagonal Crest -->
      <polygon points="36,4 66,22 66,58 36,76 6,58 6,22" fill="url(#bioGrad)" stroke="#10b981" stroke-width="2" />
      
      <!-- Bionic Hand / Neural Circuit & Pulse Line -->
      <!-- ECG / Pulse Wave Centerline -->
      <path d="M 12 40 L 24 40 L 28 26 L 34 54 L 40 32 L 44 44 L 48 40 L 60 40" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- DNA Helix Node Arcs -->
      <circle cx="28" cy="26" r="3" fill="#ffffff" />
      <circle cx="34" cy="54" r="3" fill="#52b788" />
      <circle cx="40" cy="32" r="3" fill="#ffffff" />
      
      <!-- Upper Neural Node -->
      <circle cx="36" cy="16" r="2.5" fill="#52b788" />
      <line x1="36" y1="16" x2="36" y2="28" stroke="#52b788" stroke-width="1.5" stroke-dasharray="2,2" />
    </g>

    <!-- Typography Block -->
    <text x="100" y="54" class="biyu-title">BiYU BIONICS</text>
    <text x="102" y="76" class="biyu-sub">BIOMEDICAL ENGINEERING SOCIETY</text>
    <line x1="102" y1="88" x2="330" y2="88" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <text x="102" y="108" class="biyu-dept">York University • Design Team &amp; Society</text>
    <text x="102" y="125" class="biyu-tag">HEALTHCARE INNOVATION • EST. 2026</text>
  </g>
</svg>
