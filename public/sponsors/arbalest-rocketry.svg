<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&amp;family=Inter:wght@600;800&amp;display=swap');
      .arbalest-main { font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 900; fill: #0b132b; letter-spacing: 2px; }
      .arbalest-sub { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 800; fill: #e63946; letter-spacing: 5px; }
      .arbalest-tag { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 700; fill: #4a5568; letter-spacing: 1.5px; }
    </style>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#ff7b00" />
    </linearGradient>
    <filter id="rocketDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b132b" flood-opacity="0.15" />
    </filter>
  </defs>

  <g transform="translate(15, 10)">
    <!-- Rocketry Emblem Crest -->
    <g transform="translate(18, 16)" filter="url(#rocketDrop)">
      <!-- Deep Blue Emblem Shield/Hexagon -->
      <polygon points="36,4 66,22 66,58 36,76 6,58 6,22" fill="#0b132b" stroke="#000000" stroke-width="2" />
      
      <!-- Orbital Trajectory Arc -->
      <path d="M 12 56 Q 36 10 60 22" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-dasharray="3,2" />
      
      <!-- Sleek Rocket Body -->
      <!-- Nose Cone & Fuselage -->
      <path d="M 36 12 Q 44 26 43 46 L 29 46 Q 28 26 36 12 Z" fill="#ffffff" stroke="#0b132b" stroke-width="1.5" />
      <!-- Left Fin -->
      <path d="M 29 40 L 22 52 L 29 50 Z" fill="#e63946" />
      <!-- Right Fin -->
      <path d="M 43 40 L 50 52 L 43 50 Z" fill="#e63946" />
      <!-- Rocket Center Window -->
      <circle cx="36" cy="30" r="3.5" fill="#00e5ff" stroke="#0b132b" stroke-width="1" />
      
      <!-- Rocket Exhaust Plume -->
      <polygon points="32,48 36,64 40,48 36,54" fill="url(#rocketGrad)" />
      
      <!-- Stellar Accents -->
      <circle cx="20" cy="20" r="1.5" fill="#ffd166" />
      <circle cx="54" cy="48" r="1.5" fill="#ffd166" />
    </g>

    <!-- Typography Block -->
    <text x="106" y="58" class="arbalest-main">ARBALEST</text>
    <text x="108" y="80" class="arbalest-sub">ROCKETRY</text>
    <line x1="108" y1="92" x2="320" y2="92" stroke="#e63946" stroke-width="2.5" stroke-linecap="round" />
    <text x="108" y="112" class="arbalest-tag">YORK UNIVERSITY • EST. 2022</text>
  </g>
</svg>
