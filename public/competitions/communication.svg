<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="comm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8ed" />
      <stop offset="100%" stop-color="#feedd6" />
    </linearGradient>
    <linearGradient id="comm-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb833" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <linearGradient id="comm-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283350" />
      <stop offset="100%" stop-color="#141a29" />
    </linearGradient>
    <filter id="comm-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#141a29" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Base Badge Card -->
  <rect x="25" y="15" width="350" height="270" rx="16" fill="url(#comm-bg)" stroke="#141a29" stroke-width="4" filter="url(#comm-shadow)" />

  <!-- Background Decorative Wave Grids -->
  <g opacity="0.12" stroke="#141a29" stroke-width="1.5">
    <line x1="45" y1="40" x2="355" y2="40" />
    <line x1="45" y1="70" x2="355" y2="70" />
    <line x1="45" y1="100" x2="355" y2="100" />
    <line x1="45" y1="130" x2="355" y2="130" />
    <line x1="45" y1="160" x2="355" y2="160" />
    <line x1="45" y1="190" x2="355" y2="190" />
    <line x1="45" y1="220" x2="355" y2="220" />
    <line x1="45" y1="250" x2="355" y2="250" />
  </g>

  <!-- Broadcast Radio Waves Left & Right (Centered vertically & nicely scaled) -->
  <!-- Left Waves -->
  <path d="M 136 110 A 75 75 0 0 0 136 174" fill="none" stroke="#ff9900" stroke-width="5" stroke-linecap="round" />
  <path d="M 116 94 A 100 100 0 0 0 116 190" fill="none" stroke="#39ae8a" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 5" />
  <path d="M 96 78 A 125 125 0 0 0 96 206" fill="none" stroke="#141a29" stroke-width="5" stroke-linecap="round" />
  <path d="M 76 62 A 150 150 0 0 0 76 222" fill="none" stroke="#ff9900" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  
  <!-- Right Waves -->
  <path d="M 264 110 A 75 75 0 0 1 264 174" fill="none" stroke="#ff9900" stroke-width="5" stroke-linecap="round" />
  <path d="M 284 94 A 100 100 0 0 1 284 190" fill="none" stroke="#39ae8a" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 5" />
  <path d="M 304 78 A 125 125 0 0 1 304 206" fill="none" stroke="#141a29" stroke-width="5" stroke-linecap="round" />
  <path d="M 324 62 A 150 150 0 0 1 324 222" fill="none" stroke="#ff9900" stroke-width="3" stroke-linecap="round" opacity="0.7" />

  <!-- Central Broadcast Beacon / Microphone Emblem -->
  <g id="microphone-center" transform="translate(200, 134)">
    <!-- Back Glow Aura -->
    <circle cx="0" cy="0" r="54" fill="#ff9900" opacity="0.25" />

    <!-- Mic Cradle Ring -->
    <path d="M -34 -8 C -34 32 34 32 34 -8" fill="none" stroke="#141a29" stroke-width="5" stroke-linecap="round" />
    <line x1="0" y1="32" x2="0" y2="52" stroke="#141a29" stroke-width="6" stroke-linecap="round" />
    <!-- Stand Base -->
    <path d="M -30 52 L 30 52" stroke="#141a29" stroke-width="8" stroke-linecap="round" />
    <path d="M -22 56 L 22 56" stroke="#ff9900" stroke-width="4" stroke-linecap="round" />

    <!-- Microphone Capsule Body -->
    <rect x="-21" y="-50" width="42" height="64" rx="21" fill="url(#comm-amber)" stroke="#141a29" stroke-width="5" />
    
    <!-- Capsule Inner Grille Details -->
    <line x1="-14" y1="-34" x2="14" y2="-34" stroke="#141a29" stroke-width="3" stroke-linecap="round" />
    <line x1="-16" y1="-26" x2="16" y2="-26" stroke="#141a29" stroke-width="3" stroke-linecap="round" />
    <line x1="-16" y1="-18" x2="16" y2="-18" stroke="#141a29" stroke-width="3" stroke-linecap="round" />
    <line x1="-14" y1="-10" x2="14" y2="-10" stroke="#141a29" stroke-width="3" stroke-linecap="round" />
    
    <!-- Accent Ribbon on Mic -->
    <rect x="-18" y="-2" width="36" height="8" rx="2" fill="#39ae8a" stroke="#141a29" stroke-width="2" />

    <!-- On Air Light / Signal Indicator -->
    <circle cx="0" cy="-58" r="7" fill="#e31837" stroke="#141a29" stroke-width="2.5" />
    <circle cx="-2" cy="-60" r="2" fill="#ffffff" />
  </g>

  <!-- Audio Equalizer Bars at bottom -->
  <g transform="translate(200, 224)">
    <line x1="-70" y1="6" x2="-70" y2="-6" stroke="#39ae8a" stroke-width="4" stroke-linecap="round" />
    <line x1="-56" y1="12" x2="-56" y2="-12" stroke="#ff9900" stroke-width="4" stroke-linecap="round" />
    <line x1="-42" y1="8" x2="-42" y2="-8" stroke="#141a29" stroke-width="4" stroke-linecap="round" />
    <line x1="-28" y1="18" x2="-28" y2="-18" stroke="#39ae8a" stroke-width="4" stroke-linecap="round" />
    <line x1="-14" y1="14" x2="-14" y2="-14" stroke="#ff9900" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="24" x2="0" y2="-24" stroke="#e31837" stroke-width="5" stroke-linecap="round" />
    <line x1="14" y1="14" x2="14" y2="-14" stroke="#ff9900" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="18" x2="28" y2="-18" stroke="#39ae8a" stroke-width="4" stroke-linecap="round" />
    <line x1="42" y1="8" x2="42" y2="-8" stroke="#141a29" stroke-width="4" stroke-linecap="round" />
    <line x1="56" y1="12" x2="56" y2="-12" stroke="#ff9900" stroke-width="4" stroke-linecap="round" />
    <line x1="70" y1="6" x2="70" y2="-6" stroke="#39ae8a" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
