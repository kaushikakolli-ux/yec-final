<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="jun-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2faf7" />
      <stop offset="100%" stop-color="#ddf4ec" />
    </linearGradient>
    <linearGradient id="jun-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dc9a3" />
      <stop offset="100%" stop-color="#2ca37e" />
    </linearGradient>
    <linearGradient id="jun-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb833" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <linearGradient id="jun-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283350" />
      <stop offset="100%" stop-color="#141a29" />
    </linearGradient>
    <filter id="jun-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#141a29" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Base Badge Card -->
  <rect x="25" y="15" width="350" height="270" rx="16" fill="url(#jun-bg)" stroke="#141a29" stroke-width="4" filter="url(#jun-shadow)" />

  <!-- Background Technical Isometric Dots -->
  <g opacity="0.15" fill="#141a29">
    <circle cx="60" cy="50" r="2.5" /><circle cx="100" cy="50" r="2.5" /><circle cx="140" cy="50" r="2.5" /><circle cx="180" cy="50" r="2.5" /><circle cx="220" cy="50" r="2.5" /><circle cx="260" cy="50" r="2.5" /><circle cx="300" cy="50" r="2.5" /><circle cx="340" cy="50" r="2.5" />
    <circle cx="80" cy="80" r="2.5" /><circle cx="120" cy="80" r="2.5" /><circle cx="160" cy="80" r="2.5" /><circle cx="200" cy="80" r="2.5" /><circle cx="240" cy="80" r="2.5" /><circle cx="280" cy="80" r="2.5" /><circle cx="320" cy="80" r="2.5" />
    <circle cx="60" cy="110" r="2.5" /><circle cx="100" cy="110" r="2.5" /><circle cx="140" cy="110" r="2.5" /><circle cx="180" cy="110" r="2.5" /><circle cx="220" cy="110" r="2.5" /><circle cx="260" cy="110" r="2.5" /><circle cx="300" cy="110" r="2.5" /><circle cx="340" cy="110" r="2.5" />
    <circle cx="80" cy="140" r="2.5" /><circle cx="120" cy="140" r="2.5" /><circle cx="160" cy="140" r="2.5" /><circle cx="200" cy="140" r="2.5" /><circle cx="240" cy="140" r="2.5" /><circle cx="280" cy="140" r="2.5" /><circle cx="320" cy="140" r="2.5" />
    <circle cx="60" cy="170" r="2.5" /><circle cx="100" cy="170" r="2.5" /><circle cx="140" cy="170" r="2.5" /><circle cx="180" cy="170" r="2.5" /><circle cx="220" cy="170" r="2.5" /><circle cx="260" cy="170" r="2.5" /><circle cx="300" cy="170" r="2.5" /><circle cx="340" cy="170" r="2.5" />
    <circle cx="80" cy="200" r="2.5" /><circle cx="120" cy="200" r="2.5" /><circle cx="160" cy="200" r="2.5" /><circle cx="200" cy="200" r="2.5" /><circle cx="240" cy="200" r="2.5" /><circle cx="280" cy="200" r="2.5" /><circle cx="320" cy="200" r="2.5" />
    <circle cx="60" cy="230" r="2.5" /><circle cx="100" cy="230" r="2.5" /><circle cx="140" cy="230" r="2.5" /><circle cx="180" cy="230" r="2.5" /><circle cx="220" cy="230" r="2.5" /><circle cx="260" cy="230" r="2.5" /><circle cx="300" cy="230" r="2.5" /><circle cx="340" cy="230" r="2.5" />
  </g>

  <!-- Drafting Set Square / Caliper Arms in Background -->
  <g transform="translate(200, 136)">
    <!-- Set Square 45 deg -->
    <path d="M -115 52 L -115 -42 L -20 52 Z" fill="#ffffff" stroke="#141a29" stroke-width="4" stroke-linejoin="round" />
    <path d="M -102 42 L -102 -10 L -50 42 Z" fill="#ddf4ec" stroke="#141a29" stroke-width="2.5" />
    <!-- Caliper rule ticks -->
    <line x1="-115" y1="-30" x2="-107" y2="-30" stroke="#141a29" stroke-width="2.5" />
    <line x1="-115" y1="-18" x2="-102" y2="-18" stroke="#141a29" stroke-width="2.5" />
    <line x1="-115" y1="-6" x2="-107" y2="-6" stroke="#141a29" stroke-width="2.5" />
    <line x1="-115" y1="6" x2="-102" y2="6" stroke="#141a29" stroke-width="2.5" />
    <line x1="-115" y1="18" x2="-107" y2="18" stroke="#141a29" stroke-width="2.5" />
    <line x1="-115" y1="30" x2="-102" y2="30" stroke="#141a29" stroke-width="2.5" />

    <!-- Drafting Pencil / Stylus Crossing -->
    <g transform="translate(78, -15) rotate(42)">
      <rect x="-8" y="-55" width="16" height="90" fill="#ff9900" stroke="#141a29" stroke-width="3.5" />
      <polygon points="-8,-55 0,-74 8,-55" fill="#feedd6" stroke="#141a29" stroke-width="3" />
      <polygon points="-3,-68 0,-74 3,-68" fill="#141a29" />
      <rect x="-8" y="24" width="16" height="11" fill="#e31837" stroke="#141a29" stroke-width="2.5" />
    </g>
  </g>

  <!-- Center Prototyping Mechanism: Agile Rover Chassis with Gripper -->
  <g id="junior-prototype-robot" transform="translate(200, 150)">
    <!-- Chassis Shadow -->
    <ellipse cx="0" cy="50" rx="80" ry="15" fill="#141a29" opacity="0.22" />

    <!-- Left Wheels -->
    <rect x="-78" y="14" width="22" height="42" rx="7" fill="#141a29" stroke="#141a29" stroke-width="3.5" />
    <rect x="-74" y="21" width="12" height="28" rx="4" fill="#39ae8a" />
    <!-- Right Wheels -->
    <rect x="56" y="14" width="22" height="42" rx="7" fill="#141a29" stroke="#141a29" stroke-width="3.5" />
    <rect x="62" y="21" width="12" height="28" rx="4" fill="#39ae8a" />

    <!-- Main Mechanical Body Frame -->
    <rect x="-55" y="-12" width="110" height="52" rx="10" fill="url(#jun-teal)" stroke="#141a29" stroke-width="5" />

    <!-- Metallic Perforated Build Strip (Meccano / VEX style) -->
    <rect x="-46" y="-2" width="92" height="15" rx="5" fill="#ffffff" stroke="#141a29" stroke-width="3" />
    <circle cx="-34" cy="5.5" r="3.5" fill="#141a29" />
    <circle cx="-17" cy="5.5" r="3.5" fill="#141a29" />
    <circle cx="0" cy="5.5" r="3.5" fill="#141a29" />
    <circle cx="17" cy="5.5" r="3.5" fill="#141a29" />
    <circle cx="34" cy="5.5" r="3.5" fill="#141a29" />

    <!-- Sensor / Ultrasonic Eyes -->
    <g transform="translate(0, -30)">
      <rect x="-30" y="-10" width="60" height="20" rx="10" fill="#141a29" />
      <circle cx="-15" cy="0" r="7.5" fill="#ff9900" stroke="#ffffff" stroke-width="2.5" />
      <circle cx="15" cy="0" r="7.5" fill="#ff9900" stroke="#ffffff" stroke-width="2.5" />
      <line x1="0" y1="10" x2="0" y2="18" stroke="#141a29" stroke-width="5" />
    </g>

    <!-- Mechanical Claw Gripper Arm -->
    <g transform="translate(0, -44)">
      <path d="M -24 -10 L -8 0 L -24 10" fill="none" stroke="#ff9900" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 24 -10 L 8 0 L 24 10" fill="none" stroke="#ff9900" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="0" cy="0" r="6.5" fill="#e31837" stroke="#141a29" stroke-width="2.5" />
    </g>

    <!-- Gear Accent at front -->
    <circle cx="0" cy="28" r="10" fill="#ff9900" stroke="#141a29" stroke-width="3" />
    <circle cx="0" cy="28" r="4" fill="#ffffff" />
  </g>
</svg>
