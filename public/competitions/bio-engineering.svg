<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2faf7" />
      <stop offset="100%" stop-color="#ddf4ec" />
    </linearGradient>
    <linearGradient id="bio-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dc9a3" />
      <stop offset="100%" stop-color="#2ca37e" />
    </linearGradient>
    <linearGradient id="bio-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb833" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <linearGradient id="bio-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5277" />
      <stop offset="100%" stop-color="#e31837" />
    </linearGradient>
    <filter id="bio-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#141a29" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Base Badge Card -->
  <rect x="25" y="15" width="350" height="270" rx="16" fill="url(#bio-bg)" stroke="#141a29" stroke-width="4" filter="url(#bio-shadow)" />

  <!-- Microscopic Cell Grid Background -->
  <g opacity="0.12" stroke="#141a29" stroke-width="2" fill="none">
    <circle cx="70" cy="65" r="24" />
    <circle cx="70" cy="65" r="8" fill="#141a29" />
    <circle cx="330" cy="70" r="28" />
    <circle cx="330" cy="70" r="10" fill="#141a29" />
    <circle cx="80" cy="235" r="30" />
    <circle cx="80" cy="235" r="12" fill="#141a29" />
    <circle cx="325" cy="230" r="22" />
    <circle cx="325" cy="230" r="7" fill="#141a29" />
    <!-- Molecular bonding lines -->
    <line x1="90" y1="80" x2="130" y2="110" stroke-dasharray="4 4" />
    <line x1="310" y1="85" x2="270" y2="115" stroke-dasharray="4 4" />
  </g>

  <!-- Center Bio-Engineering Apparatus & DNA Motif -->
  <g id="bioengineering-assembly" transform="translate(200, 145)">
    <!-- Base Shadow -->
    <ellipse cx="0" cy="80" rx="75" ry="14" fill="#141a29" opacity="0.22" />

    <!-- Scientific Erlenmeyer Flask (Left Center) -->
    <g transform="translate(-50, 10)">
      <!-- Liquid Gradient fill inside flask -->
      <path d="M -16 -40 L 16 -40 L 16 -20 L 44 48 C 46 54 41 62 34 62 L -34 62 C -41 62 -46 54 -44 48 L -16 -20 Z" fill="#ddf4ec" stroke="#141a29" stroke-width="4" stroke-linejoin="round" />
      <!-- Liquid Level -->
      <path d="M -30 25 Q -10 18 10 28 Q 25 32 36 28 L 44 48 C 46 54 41 62 34 62 L -34 62 C -41 62 -46 54 -44 48 Z" fill="url(#bio-teal)" stroke="#141a29" stroke-width="3" />
      <!-- Flask Lip -->
      <rect x="-20" y="-46" width="40" height="8" rx="3" fill="#ffffff" stroke="#141a29" stroke-width="3.5" />
      <!-- Measurement Lines on Flask -->
      <line x1="-12" y1="5" x2="-2" y2="5" stroke="#141a29" stroke-width="2.5" />
      <line x1="-16" y1="20" x2="-4" y2="20" stroke="#141a29" stroke-width="2.5" />
      <line x1="-22" y1="38" x2="-6" y2="38" stroke="#141a29" stroke-width="2.5" />
      <!-- Rising Bio Bubbles -->
      <circle cx="-6" cy="46" r="4" fill="#ffffff" opacity="0.9" />
      <circle cx="12" cy="38" r="3" fill="#ffffff" opacity="0.8" />
      <circle cx="4" cy="52" r="2.5" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- DNA Double Helix Tower (Right Center) -->
    <g transform="translate(45, -5)">
      <!-- DNA strands -->
      <path d="M -22 -65 Q 0 -40 22 -15 Q 0 10 -22 35 Q 0 60 22 75" fill="none" stroke="#e31837" stroke-width="5" stroke-linecap="round" />
      <path d="M 22 -65 Q 0 -40 -22 -15 Q 0 10 22 35 Q 0 60 -22 75" fill="none" stroke="#ff9900" stroke-width="5" stroke-linecap="round" />
      
      <!-- Base Pair Bonds connecting helix -->
      <line x1="-20" y1="-62" x2="20" y2="-62" stroke="#141a29" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="-20" cy="-62" r="5" fill="#e31837" stroke="#141a29" stroke-width="2" />
      <circle cx="20" cy="-62" r="5" fill="#ff9900" stroke="#141a29" stroke-width="2" />

      <line x1="-14" y1="-38" x2="14" y2="-38" stroke="#141a29" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="-14" cy="-38" r="4.5" fill="#39ae8a" stroke="#141a29" stroke-width="2" />
      <circle cx="14" cy="-38" r="4.5" fill="#ffffff" stroke="#141a29" stroke-width="2" />

      <line x1="-20" y1="-14" x2="20" y2="-14" stroke="#141a29" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="-20" cy="-14" r="5" fill="#ff9900" stroke="#141a29" stroke-width="2" />
      <circle cx="20" cy="-14" r="5" fill="#e31837" stroke="#141a29" stroke-width="2" />

      <line x1="-14" y1="10" x2="14" y2="10" stroke="#141a29" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="-14" cy="10" r="4.5" fill="#ffffff" stroke="#141a29" stroke-width="2" />
      <circle cx="14" cy="10" r="4.5" fill="#39ae8a" stroke="#141a29" stroke-width="2" />

      <line x1="-20" y1="36" x2="20" y2="36" stroke="#141a29" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="-20" cy="36" r="5" fill="#e31837" stroke="#141a29" stroke-width="2" />
      <circle cx="20" cy="36" r="5" fill="#ff9900" stroke="#141a29" stroke-width="2" />

      <line x1="-12" y1="62" x2="12" y2="62" stroke="#141a29" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="-12" cy="62" r="4.5" fill="#39ae8a" stroke="#141a29" stroke-width="2" />
      <circle cx="12" cy="62" r="4.5" fill="#ff9900" stroke="#141a29" stroke-width="2" />
    </g>

    <!-- Center Electrocardiogram / ECG Biosensor Heartbeat Monitor Pulse Badge -->
    <g transform="translate(0, 32)">
      <rect x="-42" y="-14" width="84" height="28" rx="6" fill="#141a29" stroke="#ffffff" stroke-width="2.5" filter="url(#bio-shadow)" />
      <!-- ECG pulse line -->
      <path d="M -34 0 L -18 0 L -12 -9 L -6 9 L 0 -12 L 6 7 L 12 -3 L 18 0 L 34 0" fill="none" stroke="#4dc9a3" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Top Floating Sparkles & Syringe / Bioreactor Pipette -->
    <g transform="translate(-18, -60) rotate(-35)">
      <rect x="-4" y="-20" width="8" height="42" rx="2" fill="#ffffff" stroke="#141a29" stroke-width="3" />
      <rect x="-2" y="-8" width="4" height="26" fill="#39ae8a" />
      <line x1="0" y1="22" x2="0" y2="34" stroke="#141a29" stroke-width="2.5" />
      <circle cx="0" cy="36" r="2.5" fill="#39ae8a" />
    </g>
  </g>
</svg>
