<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="deb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8ed" />
      <stop offset="100%" stop-color="#feedd6" />
    </linearGradient>
    <linearGradient id="deb-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb833" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <linearGradient id="deb-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dc9a3" />
      <stop offset="100%" stop-color="#2a9172" />
    </linearGradient>
    <linearGradient id="deb-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f03c57" />
      <stop offset="100%" stop-color="#c4102d" />
    </linearGradient>
    <linearGradient id="deb-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283350" />
      <stop offset="100%" stop-color="#141a29" />
    </linearGradient>
    <filter id="deb-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#141a29" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Base Badge Card -->
  <rect x="25" y="15" width="350" height="270" rx="16" fill="url(#deb-bg)" stroke="#141a29" stroke-width="4" filter="url(#deb-shadow)" />

  <!-- Background Decorative Diagonal Lines -->
  <g opacity="0.1" stroke="#141a29" stroke-width="1.5">
    <line x1="50" y1="20" x2="350" y2="280" />
    <line x1="100" y1="20" x2="380" y2="240" />
    <line x1="20" y1="80" x2="300" y2="280" />
    <line x1="350" y1="20" x2="50" y2="280" />
    <line x1="300" y1="20" x2="20" y2="240" />
    <line x1="380" y1="80" x2="100" y2="280" />
  </g>

  <!-- Opposing Dialogue Bubbles (Debate Dialectic) -->
  <!-- Left Bubble: Proponent (Amber) -->
  <g transform="translate(132, 78)">
    <path d="M -54 -28 C -62 -28 -68 -22 -68 -14 L -68 16 C -68 24 -62 30 -54 30 L -18 30 L -6 44 L -8 30 L 12 30 C 20 30 26 24 26 16 L 26 -14 C 26 -22 20 -28 12 -28 Z" 
          fill="url(#deb-amber)" stroke="#141a29" stroke-width="4" stroke-linejoin="round" />
    <!-- Speech bubble content lines -->
    <line x1="-52" y1="-14" x2="10" y2="-14" stroke="#141a29" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-52" y1="-2" x2="-4" y2="-2" stroke="#141a29" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-52" y1="10" x2="4" y2="10" stroke="#141a29" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Right Bubble: Opponent (Teal) -->
  <g transform="translate(268, 78)">
    <path d="M 54 -28 C 62 -28 68 -22 68 -14 L 68 16 C 68 24 62 30 54 30 L 18 30 L 6 44 L 8 30 L -12 30 C -20 30 -26 24 -26 16 L -26 -14 C -26 -22 -20 -28 -12 -28 Z" 
          fill="url(#deb-teal)" stroke="#141a29" stroke-width="4" stroke-linejoin="round" />
    <!-- Speech bubble content lines -->
    <line x1="-10" y1="-14" x2="52" y2="-14" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="4" y1="-2" x2="52" y2="-2" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-4" y1="10" x2="52" y2="10" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Central Dialectic Clash Starburst -->
  <g transform="translate(200, 74)">
    <circle cx="0" cy="0" r="18" fill="#e31837" stroke="#141a29" stroke-width="3.5" />
    <path d="M 0 -11 L 3 -3 L 11 0 L 3 3 L 0 11 L -3 3 L -11 0 L -3 -3 Z" fill="#ffffff" />
  </g>

  <!-- Central Engineering Scales of Reason & Rhetoric -->
  <g id="debate-scales" transform="translate(200, 168)">
    <!-- Scale Pillar Base -->
    <path d="M -42 58 L 42 58" stroke="#141a29" stroke-width="8" stroke-linecap="round" />
    <path d="M -28 63 L 28 63" stroke="#ff9900" stroke-width="4" stroke-linecap="round" />
    
    <!-- Central Post -->
    <line x1="0" y1="-38" x2="0" y2="58" stroke="#141a29" stroke-width="6" stroke-linecap="round" />
    <circle cx="0" cy="-38" r="8" fill="#ff9900" stroke="#141a29" stroke-width="4" />

    <!-- Balance Crossbeam (angled for dynamic deliberation) -->
    <line x1="-80" y1="-28" x2="80" y2="-44" stroke="#141a29" stroke-width="5.5" stroke-linecap="round" />

    <!-- Left Pan (Strings and Plate) -->
    <line x1="-80" y1="-28" x2="-100" y2="8" stroke="#141a29" stroke-width="2.5" />
    <line x1="-80" y1="-28" x2="-60" y2="8" stroke="#141a29" stroke-width="2.5" />
    <path d="M -108 8 C -108 24 -52 24 -52 8 Z" fill="#ff9900" stroke="#141a29" stroke-width="3.5" />
    <!-- Weight on left pan -->
    <rect x="-87" y="-2" width="14" height="10" rx="3" fill="#e31837" stroke="#141a29" stroke-width="2.5" />

    <!-- Right Pan (Strings and Plate) -->
    <line x1="80" y1="-44" x2="60" y2="-8" stroke="#141a29" stroke-width="2.5" />
    <line x1="80" y1="-44" x2="100" y2="-8" stroke="#141a29" stroke-width="2.5" />
    <path d="M 52 -8 C 52 8 108 8 108 -8 Z" fill="#39ae8a" stroke="#141a29" stroke-width="3.5" />
    <!-- Weight on right pan -->
    <circle cx="80" cy="-14" r="7" fill="#141a29" stroke="#feedd6" stroke-width="2" />

    <!-- Ceremonial Parliamentary Gavel lying across the base -->
    <g transform="translate(-18, 38) rotate(-16)">
      <!-- Gavel Handle -->
      <line x1="-32" y1="0" x2="38" y2="0" stroke="#141a29" stroke-width="6" stroke-linecap="round" />
      <line x1="-30" y1="0" x2="36" y2="0" stroke="#feedd6" stroke-width="2" stroke-linecap="round" />
      <!-- Gavel Head -->
      <rect x="22" y="-16" width="22" height="32" rx="4" fill="#e31837" stroke="#141a29" stroke-width="4" />
      <!-- Brass Rings on Head -->
      <line x1="28" y1="-16" x2="28" y2="16" stroke="#ff9900" stroke-width="3" />
      <line x1="38" y1="-16" x2="38" y2="16" stroke="#ff9900" stroke-width="3" />
    </g>
  </g>
</svg>
