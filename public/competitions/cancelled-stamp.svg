<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&amp;family=Space+Grotesk:wght@900&amp;display=swap');
      .stamp-text { font-family: 'Space Grotesk', 'Montserrat', Impact, sans-serif; font-size: 54px; font-weight: 900; fill: #d90429; letter-spacing: 6px; }
      .stamp-sub { font-family: 'Space Grotesk', 'Montserrat', sans-serif; font-size: 14px; font-weight: 900; fill: #d90429; letter-spacing: 4px; }
    </style>
    <filter id="stamp-glow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g transform="translate(200, 80) rotate(-10) translate(-200, -80)" filter="url(#stamp-glow)">
    <!-- Stamp Solid Backdrop with subtle transparency -->
    <rect x="18" y="18" width="364" height="124" rx="8" fill="#ffffff" fill-opacity="0.94" stroke="#d90429" stroke-width="6" stroke-dasharray="14,4" />
    <rect x="26" y="26" width="348" height="108" rx="4" fill="none" stroke="#d90429" stroke-width="2.5" />
    
    <!-- Top & Bottom Stamp Stars -->
    <g fill="#d90429">
      <circle cx="50" cy="52" r="4" />
      <circle cx="350" cy="52" r="4" />
      <polygon points="50,105 52,111 58,111 53,115 55,121 50,117 45,121 47,115 42,111 48,111" />
      <polygon points="350,105 352,111 358,111 353,115 355,121 350,117 345,121 347,115 342,111 348,111" />
    </g>

    <!-- Stamp Main Wordmark -->
    <text x="200" y="78" text-anchor="middle" class="stamp-text">CANCELLED</text>
    
    <!-- Dividing lines -->
    <line x1="68" y1="94" x2="332" y2="94" stroke="#d90429" stroke-width="2.5" stroke-linecap="round" />

    <!-- Subtitle text -->
    <text x="200" y="116" text-anchor="middle" class="stamp-sub">DIVISION FOR 2026/2027</text>
  </g>
</svg>
