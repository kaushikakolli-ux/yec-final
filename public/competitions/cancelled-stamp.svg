<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&amp;family=Space+Grotesk:wght@900&amp;display=swap');
      .stamp-text { font-family: 'Space Grotesk', 'Montserrat', Impact, sans-serif; font-size: 50px; font-weight: 900; fill: #d90429; letter-spacing: 5px; }
      .stamp-sub { font-family: 'Space Grotesk', 'Montserrat', sans-serif; font-size: 14px; font-weight: 900; fill: #d90429; letter-spacing: 3.5px; }
    </style>
    <filter id="stamp-glow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#stamp-glow)">
    <!-- Stamp Solid Backdrop with clean white opacity -->
    <rect x="10" y="10" width="360" height="120" rx="8" fill="#ffffff" fill-opacity="0.96" stroke="#d90429" stroke-width="5.5" stroke-dasharray="14,4" />
    <rect x="18" y="18" width="344" height="104" rx="4" fill="none" stroke="#d90429" stroke-width="2" />
    
    <!-- Top & Bottom Stamp Stars -->
    <g fill="#d90429">
      <circle cx="42" cy="46" r="3.5" />
      <circle cx="338" cy="46" r="3.5" />
      <polygon points="42,95 44,101 50,101 45,105 47,111 42,107 37,111 39,105 34,101 40,101" />
      <polygon points="338,95 340,101 346,101 341,105 343,111 338,107 333,111 335,105 330,101 336,101" />
    </g>

    <!-- Stamp Main Wordmark -->
    <text x="190" y="70" text-anchor="middle" class="stamp-text">CANCELLED</text>
    
    <!-- Dividing lines -->
    <line x1="56" y1="84" x2="324" y2="84" stroke="#d90429" stroke-width="2.5" stroke-linecap="round" />

    <!-- Subtitle text: DUE TO LOW TURNOUT -->
    <text x="190" y="105" text-anchor="middle" class="stamp-sub">DUE TO LOW TURNOUT</text>
  </g>
</svg>
