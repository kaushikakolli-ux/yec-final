<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="inn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8ed" />
      <stop offset="100%" stop-color="#feedd6" />
    </linearGradient>
    <linearGradient id="inn-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb833" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <linearGradient id="inn-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dc9a3" />
      <stop offset="100%" stop-color="#2a9172" />
    </linearGradient>
    <linearGradient id="inn-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283350" />
      <stop offset="100%" stop-color="#141a29" />
    </linearGradient>
    <radialGradient id="inn-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb833" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0" />
    </radialGradient>
    <filter id="inn-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#141a29" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Base Badge Card -->
  <rect x="25" y="15" width="350" height="270" rx="16" fill="url(#inn-bg)" stroke="#141a29" stroke-width="4" filter="url(#inn-shadow)" />

  <!-- Blueprint Technical Grid Lines -->
  <g opacity="0.14" stroke="#141a29" stroke-width="1.5">
    <!-- Concentric blueprint circles -->
    <circle cx="200" cy="145" r="70" fill="none" stroke-dasharray="5 5" />
    <circle cx="200" cy="145" r="105" fill="none" stroke-dasharray="3 5" />
    <!-- Crosshairs -->
    <line x1="60" y1="145" x2="340" y2="145" stroke-dasharray="6 4" />
    <line x1="200" y1="25" x2="200" y2="275" stroke-dasharray="6 4" />
  </g>

  <!-- Interlocking Engineering Gears in Background -->
  <!-- Upper Left Gear (Teal) -->
  <g transform="translate(118, 105)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#39ae8a" stroke-width="8" stroke-dasharray="9 7" />
    <circle cx="0" cy="0" r="22" fill="#39ae8a" stroke="#141a29" stroke-width="3.5" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#141a29" stroke-width="2.5" />
  </g>

  <!-- Lower Right Gear (Amber) -->
  <g transform="translate(282, 185)">
    <circle cx="0" cy="0" r="36" fill="none" stroke="#ff9900" stroke-width="9" stroke-dasharray="10 8" />
    <circle cx="0" cy="0" r="24" fill="#ff9900" stroke="#141a29" stroke-width="3.5" />
    <circle cx="0" cy="0" r="9" fill="#ffffff" stroke="#141a29" stroke-width="2.5" />
  </g>

  <!-- Central Lightbulb & Invention Filament Motif -->
  <g id="lightbulb-center" transform="translate(200, 142)">
    <!-- Radiating Innovation Rays -->
    <g stroke="#ff9900" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-72" x2="0" y2="-90" />
      <line x1="50" y1="-50" x2="64" y2="-64" />
      <line x1="74" y1="0" x2="92" y2="0" />
      <line x1="-50" y1="-50" x2="-64" y2="-64" />
      <line x1="-74" y1="0" x2="-92" y2="0" />
    </g>
    <!-- Little Spark Stars -->
    <g fill="#e31837">
      <circle cx="-68" cy="-36" r="4.5" />
      <circle cx="68" cy="-36" r="4.5" />
      <circle cx="44" cy="-74" r="3.5" />
      <circle cx="-44" cy="-74" r="3.5" />
    </g>

    <!-- Warm Golden Aura -->
    <circle cx="0" cy="-10" r="60" fill="url(#inn-glow)" />

    <!-- Lightbulb Outer Glass Bulb -->
    <path d="M -44 -12 
             C -44 -38 -24 -60 0 -60 
             C 24 -60 44 -38 44 -12 
             C 44 8 28 26 22 40 
             L -22 40 
             C -28 26 -44 8 -44 -12 Z" 
          fill="#ffffff" stroke="#141a29" stroke-width="5" stroke-linejoin="round" />

    <!-- Inner Golden Filament Atom / Infinite Circuit Loop -->
    <path d="M -22 12 L -14 -22 C -14 -35 14 -35 14 -22 L 22 12" 
          fill="none" stroke="#ff9900" stroke-width="5" stroke-linecap="round" />
    <!-- Center glowing spark inside bulb -->
    <circle cx="0" cy="-24" r="9" fill="#ff9900" stroke="#141a29" stroke-width="3" />
    <circle cx="0" cy="-24" r="4" fill="#ffffff" />

    <!-- Screw Base Collar (Metallic Segments) -->
    <g transform="translate(0, 40)">
      <rect x="-20" y="0" width="40" height="9" rx="3" fill="#feedd6" stroke="#141a29" stroke-width="3.5" />
      <rect x="-18" y="9" width="36" height="8" rx="2.5" fill="#39ae8a" stroke="#141a29" stroke-width="3" />
      <rect x="-14" y="17" width="28" height="8" rx="2.5" fill="#feedd6" stroke="#141a29" stroke-width="3" />
      <path d="M -9 25 L 9 25 L 4 32 L -4 32 Z" fill="#141a29" />
    </g>
  </g>
</svg>
