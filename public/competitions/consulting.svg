<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="con-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2faf7" />
      <stop offset="100%" stop-color="#ddf4ec" />
    </linearGradient>
    <linearGradient id="con-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dc9a3" />
      <stop offset="100%" stop-color="#2ca37e" />
    </linearGradient>
    <linearGradient id="con-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb833" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <linearGradient id="con-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283350" />
      <stop offset="100%" stop-color="#141a29" />
    </linearGradient>
    <filter id="con-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#141a29" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Base Badge Card -->
  <rect x="25" y="15" width="350" height="270" rx="16" fill="url(#con-bg)" stroke="#141a29" stroke-width="4" filter="url(#con-shadow)" />

  <!-- Urban Isometric Grid Lines in Background -->
  <g opacity="0.14" stroke="#141a29" stroke-width="1.5">
    <line x1="45" y1="210" x2="355" y2="210" />
    <line x1="45" y1="160" x2="355" y2="160" />
    <line x1="45" y1="110" x2="355" y2="110" />
    <line x1="45" y1="60" x2="355" y2="60" />
    <line x1="110" y1="35" x2="110" y2="265" stroke-dasharray="4 4" />
    <line x1="200" y1="35" x2="200" y2="265" stroke-dasharray="4 4" />
    <line x1="290" y1="35" x2="290" y2="265" stroke-dasharray="4 4" />
  </g>

  <!-- Center Infrastructure & Strategic Analytics Motif -->
  <g id="consulting-city-chart" transform="translate(200, 150)">
    <!-- Architectural Skyscrapers Skyline -->
    <!-- Building 1 (Left - Industrial/Civic) -->
    <rect x="-85" y="-20" width="38" height="85" rx="4" fill="#ffffff" stroke="#141a29" stroke-width="4" />
    <!-- Windows grid on Building 1 -->
    <g fill="#39ae8a">
      <rect x="-77" y="-10" width="8" height="10" rx="1.5" />
      <rect x="-63" y="-10" width="8" height="10" rx="1.5" />
      <rect x="-77" y="10" width="8" height="10" rx="1.5" />
      <rect x="-63" y="10" width="8" height="10" rx="1.5" />
      <rect x="-77" y="30" width="8" height="10" rx="1.5" />
      <rect x="-63" y="30" width="8" height="10" rx="1.5" />
    </g>

    <!-- Building 2 (Center - Iconic Modern Tower with Spire) -->
    <rect x="-40" y="-60" width="56" height="125" rx="5" fill="url(#con-teal)" stroke="#141a29" stroke-width="5" />
    <!-- Spire on Tower 2 -->
    <line x1="-12" y1="-60" x2="-12" y2="-90" stroke="#141a29" stroke-width="4" stroke-linecap="round" />
    <circle cx="-12" cy="-90" r="4.5" fill="#e31837" stroke="#141a29" stroke-width="2" />
    <!-- Angular Glass Facet line -->
    <line x1="-38" y1="-50" x2="14" y2="15" stroke="#ffffff" stroke-width="2.5" opacity="0.6" />
    <!-- Windows on Center Tower -->
    <g fill="#ffffff">
      <rect x="-30" y="-40" width="10" height="13" rx="1.5" />
      <rect x="-10" y="-40" width="10" height="13" rx="1.5" />
      <rect x="-30" y="-16" width="10" height="13" rx="1.5" />
      <rect x="-10" y="-16" width="10" height="13" rx="1.5" />
      <rect x="-30" y="8" width="10" height="13" rx="1.5" />
      <rect x="-10" y="8" width="10" height="13" rx="1.5" />
      <rect x="-30" y="32" width="10" height="13" rx="1.5" />
      <rect x="-10" y="32" width="10" height="13" rx="1.5" />
    </g>

    <!-- Building 3 (Right - Tiered Sustainable Complex) -->
    <rect x="25" y="-10" width="60" height="75" rx="4" fill="#ffffff" stroke="#141a29" stroke-width="4" />
    <polygon points="25,-10 55,-35 85,-10" fill="#ff9900" stroke="#141a29" stroke-width="3.5" />
    <!-- Solar panel rows on Building 3 -->
    <line x1="36" y1="12" x2="74" y2="12" stroke="#141a29" stroke-width="3" />
    <line x1="36" y1="32" x2="74" y2="32" stroke="#141a29" stroke-width="3" />

    <!-- Strategic Upward Feasibility Growth Trajectory Line (Vector Arrow) -->
    <path d="M -98 48 L -45 28 L 6 -6 L 82 -58" fill="none" stroke="#ff9900" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Data points along trend line -->
    <circle cx="-98" cy="48" r="6" fill="#141a29" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="-45" cy="28" r="6" fill="#39ae8a" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="6" cy="-6" r="6" fill="#141a29" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="82" cy="-58" r="7.5" fill="#e31837" stroke="#ffffff" stroke-width="3" />
    <!-- Trajectory Arrow Head -->
    <polygon points="82,-74 98,-56 76,-46" fill="#e31837" stroke="#141a29" stroke-width="2.5" />

    <!-- Sustainability Leaf Badge Icon at Bottom Left -->
    <g transform="translate(-88, 48)">
      <circle cx="0" cy="0" r="14" fill="#39ae8a" stroke="#141a29" stroke-width="2.5" />
      <path d="M -6 4 C -6 -5 0 -9 6 -9 C 6 0 0 6 -6 4 Z" fill="#ffffff" />
    </g>

    <!-- Strategy Compass at Bottom Right -->
    <g transform="translate(85, 48)">
      <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#141a29" stroke-width="2.5" />
      <polygon points="0,-9 4,0 0,9 -4,0" fill="#e31837" />
    </g>
  </g>
</svg>
