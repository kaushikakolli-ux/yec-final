<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="prog-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2faf7" />
      <stop offset="100%" stop-color="#ddf4ec" />
    </linearGradient>
    <linearGradient id="prog-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dc9a3" />
      <stop offset="100%" stop-color="#2ca37e" />
    </linearGradient>
    <linearGradient id="prog-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb833" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <linearGradient id="prog-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283350" />
      <stop offset="100%" stop-color="#141a29" />
    </linearGradient>
    <filter id="prog-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#141a29" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Base Badge Card -->
  <rect x="25" y="15" width="350" height="270" rx="16" fill="url(#prog-bg)" stroke="#141a29" stroke-width="4" filter="url(#prog-shadow)" />

  <!-- Code Matrix Pattern Grid in Background -->
  <g opacity="0.12" fill="#141a29" font-family="monospace" font-size="11" font-weight="bold">
    <text x="45" y="50">01101001 01101110 01101001 01110100</text>
    <text x="45" y="70">const solve = (problem: Challenge) =&gt; {</text>
    <text x="45" y="90">  optimize(algorithm, complexity);</text>
    <text x="45" y="240">  return deployment.status === 200;</text>
    <text x="45" y="260">}; // YEC PROGRAMMING CHALLENGE</text>
  </g>

  <!-- Center IDE & Terminal Workstation -->
  <g id="programming-workstation" transform="translate(200, 145)">
    <!-- Shadow -->
    <ellipse cx="0" cy="85" rx="85" ry="14" fill="#141a29" opacity="0.22" />

    <!-- Terminal Window Behind -->
    <rect x="-95" y="-85" width="190" height="135" rx="10" fill="#141a29" stroke="#141a29" stroke-width="4" />
    <!-- Terminal Titlebar -->
    <rect x="-95" y="-85" width="190" height="22" rx="10" fill="#283350" />
    <circle cx="-80" cy="-74" r="4" fill="#e31837" />
    <circle cx="-68" cy="-74" r="4" fill="#ff9900" />
    <circle cx="-56" cy="-74" r="4" fill="#39ae8a" />
    <text x="-40" y="-70" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">terminal ~ yec-engine</text>

    <!-- Code Editor Content -->
    <!-- Line numbers & code lines -->
    <g fill="#4dc9a3" font-family="monospace" font-size="11" font-weight="bold">
      <text x="-80" y="-45">&gt; npm run yec-test</text>
      <text x="-80" y="-28" fill="#ffffff">[✓] 12/12 PASS</text>
      <text x="-80" y="-11" fill="#ffb833">&gt; runtime: 18ms</text>
    </g>

    <!-- Code Brackets Floating Graphic -->
    <g transform="translate(0, 10)">
      <!-- Main glowing bracket badge -->
      <rect x="-65" y="-12" width="130" height="48" rx="8" fill="#ffffff" stroke="#141a29" stroke-width="4" filter="url(#prog-shadow)" />
      
      <!-- Left Angle Bracket < / > -->
      <path d="M -42 12 L -28 -1 L -28 5 L -38 12 L -28 19 L -28 25 Z" fill="#e31837" stroke="#141a29" stroke-width="1.5" />
      <path d="M -12 25 L 0 -1 L 6 -1 L -6 25 Z" fill="#39ae8a" stroke="#141a29" stroke-width="1.5" />
      <path d="M 42 12 L 28 -1 L 28 5 L 38 12 L 28 19 L 28 25 Z" fill="#ff9900" stroke="#141a29" stroke-width="1.5" />
    </g>

    <!-- Laptop Base Stand -->
    <path d="M -110 58 L 110 58 L 95 72 L -95 72 Z" fill="#ffffff" stroke="#141a29" stroke-width="4" stroke-linejoin="round" />
    <rect x="-30" y="60" width="60" height="5" rx="2" fill="#141a29" />

    <!-- Binary Badge Accents -->
    <g transform="translate(-85, -6)">
      <circle cx="0" cy="0" r="14" fill="#ff9900" stroke="#141a29" stroke-width="3" />
      <text x="-7" y="5" fill="#141a29" font-family="monospace" font-size="13" font-weight="900">{ }</text>
    </g>
    <g transform="translate(85, -6)">
      <circle cx="0" cy="0" r="14" fill="#39ae8a" stroke="#141a29" stroke-width="3" />
      <text x="-6" y="5" fill="#ffffff" font-family="monospace" font-size="11" font-weight="900">&lt;/&gt;</text>
    </g>
  </g>
</svg>
