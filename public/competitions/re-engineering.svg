<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="re-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2faf7" />
      <stop offset="100%" stop-color="#ddf4ec" />
    </linearGradient>
    <linearGradient id="re-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dc9a3" />
      <stop offset="100%" stop-color="#2ca37e" />
    </linearGradient>
    <linearGradient id="re-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb833" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <linearGradient id="re-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283350" />
      <stop offset="100%" stop-color="#141a29" />
    </linearGradient>
    <filter id="re-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#141a29" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Base Badge Card -->
  <rect x="25" y="15" width="350" height="270" rx="16" fill="url(#re-bg)" stroke="#141a29" stroke-width="4" filter="url(#re-shadow)" />

  <!-- CAD Coordinate Reticle & Polar Circles -->
  <g opacity="0.18" stroke="#141a29" stroke-width="1.5" fill="none">
    <circle cx="200" cy="148" r="95" stroke-dasharray="4 6" />
    <circle cx="200" cy="148" r="65" />
    <circle cx="200" cy="148" r="35" stroke-dasharray="2 4" />
    <line x1="80" y1="148" x2="320" y2="148" stroke-dasharray="8 5" />
    <line x1="200" y1="28" x2="200" y2="268" stroke-dasharray="8 5" />
  </g>

  <!-- Re-Engineering Circular Arrows Feedback Loop (Redesign & Optimization) -->
  <g id="cyclical-arrows" transform="translate(200, 148)">
    <!-- Top Arc Arrow (Teal) -->
    <path d="M -64 -46 A 80 80 0 0 1 70 -38" fill="none" stroke="url(#re-teal)" stroke-width="8.5" stroke-linecap="round" />
    <!-- Arrowhead at right -->
    <polygon points="70,-52 88,-30 60,-28" fill="#2ca37e" stroke="#141a29" stroke-width="2.5" />

    <!-- Bottom Arc Arrow (Amber) -->
    <path d="M 64 46 A 80 80 0 0 1 -70 38" fill="none" stroke="url(#re-amber)" stroke-width="8.5" stroke-linecap="round" />
    <!-- Arrowhead at left -->
    <polygon points="-70,52 -88,30 -60,28" fill="#ff9900" stroke="#141a29" stroke-width="2.5" />

    <!-- Central Exploded Teardown Mechanism (Precision Gear + Ball Bearings) -->
    <!-- Center Axle Hub Outer Ring -->
    <circle cx="0" cy="0" r="44" fill="#ffffff" stroke="#141a29" stroke-width="5" />
    
    <!-- Precision Gear Teeth Outer Rim -->
    <circle cx="0" cy="0" r="36" fill="none" stroke="#141a29" stroke-width="8" stroke-dasharray="8 10.5" />

    <!-- Internal Ball Bearing Ring -->
    <circle cx="0" cy="0" r="22" fill="#ddf4ec" stroke="#141a29" stroke-width="3" />
    <!-- Steel Bearings Ring -->
    <circle cx="0" cy="-14" r="4.5" fill="#ff9900" stroke="#141a29" stroke-width="2" />
    <circle cx="12" cy="-7" r="4.5" fill="#39ae8a" stroke="#141a29" stroke-width="2" />
    <circle cx="12" cy="7" r="4.5" fill="#ff9900" stroke="#141a29" stroke-width="2" />
    <circle cx="0" cy="14" r="4.5" fill="#39ae8a" stroke="#141a29" stroke-width="2" />
    <circle cx="-12" cy="7" r="4.5" fill="#ff9900" stroke="#141a29" stroke-width="2" />
    <circle cx="-12" cy="-7" r="4.5" fill="#39ae8a" stroke="#141a29" stroke-width="2" />
    
    <!-- Core Shaft Hole -->
    <circle cx="0" cy="0" r="6" fill="#141a29" />
  </g>
</svg>
